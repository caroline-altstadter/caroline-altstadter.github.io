<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bad Volume Control</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Stack+Sans+Headline:wght@200..700&family=Zen+Dots&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="finalProject.css">
</head>
<body>
    <div id="startScreen">
        <h1>Volume Control</h1>
        <p>Set your goal volume:</p>
        <input type="number" id="goalInput" min="0" max="100" value="0">
        <button id="startButton">Start</button>
    </div>

    <div id="gamePlay">
        <div id="volumeDisplay">Volume: <span id="volumeNumber">50</span>%</div>
        <div id="goalDisplay">Goal: <span id="goalNumber">??</span>%</div>
        <div id="bucket">___</div>
    </div>

    <div id="winScreen">
        <h1>Congratulations!</h1>
        <p>Your volume has been set!</p>
        <button id="restartButton">Play Again</button>
    </div>

    <script src="finalProject.js"></script>
</body>
</html>
